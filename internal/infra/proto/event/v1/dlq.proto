
syntax = "proto3";

package event.v1;

option go_package = "erp.localhost/infra/model/event/v1;eventv1";

import "google/protobuf/timestamp.proto";
import "tagger/tagger.proto";
import "event/v1/message.proto";

message DlqEntry {
    string topic = 1 [(tagger.tags) = "bson:\"topic\" json:\"topic\""];
    string partition_key = 2 [(tagger.tags) = "bson:\"partition_key\" json:\"partition_key\""];
    event.v1.Message message = 3 [(tagger.tags) = "bson:\"message\" json:\"message\""];

    // Retry tracking
    int32 retries = 4 [(tagger.tags) = "bson:\"retries\" json:\"retries\""];
    int32 max_retries = 5 [(tagger.tags) = "bson:\"max_retries\" json:\"max_retries\""];
    google.protobuf.Timestamp next_retry_at = 6 [(tagger.tags) = "bson:\"next_retry_at\" json:\"next_retry_at\""];
    
    // Metadata
    google.protobuf.Timestamp created_at = 7 [(tagger.tags) = "bson:\"created_at\" json:\"created_at\""];
    google.protobuf.Timestamp updated_at = 8 [(tagger.tags) = "bson:\"updated_at\" json:\"updated_at\""];
    string last_error = 9 [(tagger.tags) = "bson:\"last_error\" json:\"last_error\""];
}